name: build-and-push

# Builds the worker image on GitHub's machines and pushes it to GHCR, so nothing
# large goes through a home connection. The RunPod endpoint can use
# ghcr.io/macguyversmusic/docker_m4:latest directly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The image is about 50 GB; the runner's free disk is far smaller until the
      # preinstalled toolchains are removed.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show free disk
        run: df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/macguyversmusic/docker_m4:latest
            ghcr.io/macguyversmusic/docker_m4:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Show free disk after the build
        if: always()
        run: df -h /
